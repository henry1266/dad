<!doctype html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1024">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>{{ title | default('Impress.js 簡報') }} - 易經互動網頁</title>
    <meta name="description" content="易經互動網頁投影片">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:regular,semibold,italic,italicsemibold|PT+Sans:400,700,400italic,700italic|PT+Serif:400,700,400italic,700italic" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/impress-demo.css') }}" rel="stylesheet">
    <style>
        .slide { padding: 40px; box-sizing: border-box; font-family: 'PT Serif', serif; line-height: 1.5; font-size: 24px; overflow-y: auto; max-height: 700px; }
        .slide h1, .slide h2, .slide h3 { font-family: 'Open Sans', sans-serif; font-weight: bold; margin-bottom: .5em; }
        .error-message { color: #8b0000; border: 1px solid #8b0000; padding: 10px; margin-bottom: 20px; background: #ffebeb; white-space: pre-wrap; }
    </style>
</head>
<body class="impress-not-supported">
    <div class="fallback-message">
        <p>瀏覽器不支援 impress.js 所需功能，因此將顯示簡化版本。</p>
    </div>
    <div id="impress" data-transition-duration="1000">
        {% if error_message and not slides_data %}
            <div class="step slide" data-x="0" data-y="0">
                <div class="error-message">
                    <h2>錯誤訊息</h2>
                    <p>{{ error_message }}</p>
                </div>
            </div>
        {% endif %}
        {% block slides_content %}{% endblock %}
    </div>
    <script src="{{ url_for('static', filename='js/impress.js') }}"></script>
    <script>impress().init();</script>
</body>
</html>
